conky.config = {
    -- Output & Session configuration (Xwayland with KWin rules for DP-2 on all virtual desktops)
    out_to_wayland = false,
    out_to_x = true,
    out_to_console = false,
    own_window = true,
    own_window_class = 'conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#1A000000', -- Black at ~10% opacity across the whole canvas.

    -- Double Buffering & Smoothness
    double_buffer = true,
    background = false,

    -- Geometry: Spanning full width of DP-2 (1920px) from y=44 (below top bar) to y=810 (above GLava peaks)
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 44,
    minimum_width = 1920,
    maximum_width = 1920,
    minimum_height = 766,

    -- Borders & Visual Framing
    draw_borders = false,
    border_width = 0,
    border_inner_margin = 0,
    border_outer_margin = 0,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    default_shade_color = '#000000',

    -- Cybercore Palette: Neon Violet (#BD00FF) Titles + Neon Green (#00FF44) Content & Bars
    default_color = '#00FF44',       -- Neon Green content
    default_outline_color = '#000000',
    color1 = '#00FF44',             -- Winamp Neon Green (active metrics, bars & values)
    color2 = '#BD00FF',             -- Cybercore Neon Violet (module titles & headings)
    color3 = '#00AA2B',             -- Winamp Medium Green (labels & units)
    color4 = '#BD00FF',             -- Cybercore Neon Violet secondary
    color5 = '#00771E',             -- Deep Green accent
    color6 = '#550077',             -- Subtle Dark Violet structural dividers

    -- Typography: Large, bold retro monospace for high contrast on light backgrounds
    use_xft = true,
    font = 'Share Tech Mono:size=12:bold',
    font1 = 'Share Tech Mono:size=11:bold',
    font2 = 'Share Tech Mono:size=12:bold',
    font3 = 'Share Tech Mono:size=14:bold',
    font4 = 'Share Tech Mono:size=9:bold',

    -- 20 redraws/s for animation; average telemetry over 0.7 seconds (Conky supports up to 14 samples).
    -- GPU polling remains in the existing daemon, not in the render loop.
    update_interval = 0.05,
    cpu_avg_samples = 14,
    net_avg_samples = 14,
    no_buffers = true,
    uppercase = false,

    -- Lua scripts
    lua_load = (debug.getinfo(1, 'S').source:match('^@(.*/)') or (os.getenv('HOME') .. '/.config/conky/')) .. 'gpu.lua',
    lua_draw_hook_post = 'draw_ring',
}

-- Based on the original Gemini layout: fixed column anchors, varied gaps.
conky.text = [[
${goto 40}${color2}${font3}[ CYBERCORE MAINFRAME // SYSTEM INTERFACE ]${font}${alignr 40}${color3}KERNEL: ${color1}${kernel} ${color3}// UPTIME: ${color1}${uptime}
${goto 40}${color6}${hr 1}
${goto 1300}${color2}${font2}// 06 // CPU // AMD RYZEN 5 5600X ///////////${font}
${goto 40}${color2}${font2}// 01 // RUNTIME ///////////////////////////${font}${goto 1300}${color3}LOAD: ${color1}${font3}${cpu}%${font}   ${color3}TEMP: ${color1}${font3}${hwmon k10temp temp 1}°C${font}   ${color3}FREQ: ${color1}${freq_g 1} GHz
${goto 40}${color1}${lua runtime_row 1}${goto 1300}${color1}${cpubar 6,560}
${goto 40}${color1}${lua runtime_row 2}${goto 1300}${font1}${color3}T1: ${color1}${cpu cpu1}%  ${color3}T2: ${color1}${cpu cpu2}%  ${color3}T3: ${color1}${cpu cpu3}%  ${color3}T4: ${color1}${cpu cpu4}%  ${font}
${goto 40}${color1}${lua runtime_row 3}${goto 1300}${font1}${color3}T5: ${color1}${cpu cpu5}%  ${color3}T6: ${color1}${cpu cpu6}%  ${color3}T7: ${color1}${cpu cpu7}%  ${color3}T8: ${color1}${cpu cpu8}%  ${font}
${goto 40}${color1}${lua runtime_row 4}${goto 680}${color2}${font2}// 02 // LOADING MODULES ///////////////////${font}${goto 1300}${font1}${color3}T9: ${color1}${cpu cpu9}%  ${color3}T10: ${color1}${cpu cpu10}%  ${color3}T11: ${color1}${cpu cpu11}%  ${color3}T12: ${color1}${cpu cpu12}%  ${font}
${goto 40}${color3}${lua runtime_row 5}
${goto 1300}${color2}${font2}// 07 // GPU // NVIDIA RTX 3080 Ti /////////${font}
${goto 1300}${color3}LOAD: ${color1}${font3}${lua gpu_val util}%${font}   ${color3}TEMP: ${color1}${font3}${lua gpu_val temp}°C${font}
${goto 1300}${color1}${lua_bar 6,560 gpu_util}
${goto 40}${color2}${font2}// 03 // MODULE QUEUE //////////////////////${font}${goto 1300}${color3}VRAM: ${color1}${lua gpu_val memused} / ${lua gpu_val memtotal} MiB (${lua gpu_val memutil}%)
${goto 40}${color3}${lua queue_row 0}${goto 1300}${color1}${lua_bar 4,560 gpu_memutil}
${goto 40}${color3}${lua queue_row 1}${goto 1300}${color3}POWER: ${color1}${lua gpu_val power} W   ${color3}FAN: ${color1}${lua gpu_val fan}%
${goto 40}${color3}${lua queue_row 2}${goto 680}${color3}MODULES:  ${color1}${lua module_count} / 24
${goto 40}${color3}${lua queue_row 3}${goto 680}${color3}STATUS:   ${color1}LOADING${lua dots}
${goto 40}${color3}${lua queue_row 4}${goto 680}${color3}BUFFER:   ${color1}[READY]
${goto 40}${color3}${lua queue_row 5}
${goto 40}${color3}${lua queue_row 6}${goto 1300}${color2}${font2}// 08 // MEMORY & NVMe /////////////////////${font}
${goto 40}${color3}${lua queue_row 7}${goto 1300}${color3}RAM: ${color1}${font3}${memperc}%${font}  ${mem} / ${memmax}
${goto 1300}${color1}${membar 5,560}
${goto 1300}${color3}BTRFS: ${color1}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${goto 1300}${color1}${fs_bar 4,560 /}
${goto 680}${color2}${font2}// 05 // PREPARING INJECTION ///////////////${font}${goto 1300}${color3}ROOT + HOME / SHARED POOL
${goto 680}${color1}${lua injection_bar}
${goto 40}${color2}${font2}// 04 // ACTIVE PROCESSES //////////////////${font}${goto 680}${color1}${lua injection_stage 1}${goto 1300}${color2}${font2}// 09 // NETWORK // enp5s0 /////////////////${font}
${goto 40}${color3}PROCESS${goto 330}CPU${goto 440}RAM${goto 680}${color1}${lua injection_stage 2}${goto 1300}${color3}HOST IP: ${color1}${addr enp5s0}
${goto 40}${color1}${lua process_value 1 name}${goto 330}${lua process_value 1 cpu}%${goto 440}${color3}${lua process_value 1 mem}%${goto 680}${color1}${lua injection_stage 3}${goto 1300}${color3}DOWN: ${color1}${downspeed enp5s0}/s   ${color3}TOTAL: ${color1}${totaldown enp5s0}
${goto 40}${color1}${lua process_value 2 name}${goto 330}${lua process_value 2 cpu}%${goto 440}${color3}${lua process_value 2 mem}%${goto 1300}${color1}${downspeedgraph enp5s0 24,560 00FF44 004D14 -l}
${goto 40}${color1}${lua process_value 3 name}${goto 330}${lua process_value 3 cpu}%${goto 440}${color3}${lua process_value 3 mem}%
${goto 40}${color1}${lua process_value 4 name}${goto 330}${lua process_value 4 cpu}%${goto 440}${color3}${lua process_value 4 mem}%${goto 1300}${color3}UP:   ${color1}${upspeed enp5s0}/s   ${color3}TOTAL: ${color1}${totalup enp5s0}
${goto 40}${color1}${lua process_value 5 name}${goto 330}${lua process_value 5 cpu}%${goto 440}${color3}${lua process_value 5 mem}%${goto 680}${color3}SYNCING CACHE ${color1}${lua sequence_status cache}${goto 1300}${color1}${upspeedgraph enp5s0 24,560 00FF44 004D14 -l}
${goto 680}${color3}NEXT CYCLE    ${color1}${lua next_cycle}
${goto 40}${color3}>> Waiting for handshake ${color1}${lua spinner 2}

]]
