conky.config = {
    -- Output & Session configuration (Xwayland with KWin rules for DP-2 on all virtual desktops)
    out_to_wayland = false,
    out_to_x = true,
    out_to_console = false,
    own_window = true,
    own_window_class = 'conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_colour = '#00000000',

    -- Double Buffering & Smoothness
    double_buffer = true,
    background = false,

    -- Geometry: Spanning full width of DP-2 (1920px) from y=56 to y=852 (height=794px)
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 56,
    minimum_width = 1920,
    maximum_width = 1920,
    minimum_height = 802,

    -- Borders & Visual Framing: Borderless and fully transparent
    draw_borders = false,
    border_width = 0,
    border_inner_margin = 0,
    border_outer_margin = 0,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,

    -- Cybercore Color Palette
    default_color = '#E0F8FF',       -- Ice white
    default_outline_color = '#00F0FF',
    color1 = '#00F0FF',             -- Neon Cyan
    color2 = '#A200FF',             -- Neon Violet
    color3 = '#8A6B9C',             -- Muted Slate / Purple
    color4 = '#00E5FF',             -- Bright Cyan
    color5 = '#FF0055',             -- Warning Crimson
    color6 = '#2D0B46',             -- Dark Frame Violet

    -- Typography
    use_xft = true,
    font = 'Exo 2:size=9',
    font1 = 'Share Tech Mono:size=9',
    font2 = 'Share Tech Mono:size=10:bold',
    font3 = 'Exo 2:size=11:bold',
    font4 = 'Share Tech Mono:size=8',

    -- Polling
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    uppercase = false,

    -- Lua scripts
    lua_load = '/home/julian/.config/conky/gpu.lua',
}

