<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="64" height="64" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #15051A; fill-opacity: 0.95; }
      .border { fill: #A200FF; }
      .transparent { fill: none; }
    </style>
  </defs>

  <!-- Hints for internal padding -->
  <rect id="hint-top-margin" x="0" y="0" width="64" height="16" class="transparent" />
  <rect id="hint-bottom-margin" x="0" y="48" width="64" height="16" class="transparent" />
  <rect id="hint-left-margin" x="0" y="0" width="16" height="64" class="transparent" />
  <rect id="hint-right-margin" x="48" y="0" width="16" height="64" class="transparent" />

  <!-- Center (the drawn background area) -->
  <rect id="center" x="2" y="2" width="60" height="60" class="bg" />

  <!-- Borders (Sides) -->
  <rect id="top" x="2" y="0" width="60" height="2" class="border" />
  <rect id="bottom" x="2" y="62" width="60" height="2" class="border" />
  <rect id="left" x="0" y="2" width="2" height="60" class="border" />
  <rect id="right" x="62" y="2" width="2" height="60" class="border" />

  <!-- Corners -->
  <path id="topleft" d="M0,2 L0,0 L2,0 L2,2 Z" class="border" />
  <path id="topright" d="M62,0 L64,0 L64,2 L62,2 Z" class="border" />
  <path id="bottomleft" d="M0,62 L0,64 L2,64 L2,62 Z" class="border" />
  <path id="bottomright" d="M62,62 L64,64 L64,62 L62,62 Z" class="border" />

</svg>
